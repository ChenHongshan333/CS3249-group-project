name: Build and test CookAlong

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build

  server-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  flutter-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      # Pinned to the version the team develops with, so a new Flutter
      # release can't break CI on its own.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      # Roboto from the SDK, which the text-fit and screenshot tests use.
      - run: flutter precache --universal
      - name: Find fonts (temporary)
        run: |
          echo "FLUTTER_ROOT=$FLUTTER_ROOT"
          ls "$FLUTTER_ROOT/bin/cache/artifacts" || true
          find / -iname 'roboto-regular.ttf' 2>/dev/null | head
          cat "$FLUTTER_ROOT/bin/cache/material_fonts.stamp" 2>/dev/null || echo no stamp
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Renders every screen and fails on any overflow.
      - run: flutter test test/screenshot_test.dart
        env:
          SCREENSHOT_DIR: ${{ runner.temp }}/screens
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: ${{ runner.temp }}/screens
          if-no-files-found: ignore
